<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101312" media="(prefers-color-scheme: dark)">

  <title>Brian McMichael</title>
  <meta name="description" content="Brian McMichael — US-based technical leader building in blockchain and financial systems.">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="Brian McMichael">
  <meta property="og:description" content="Technical leader in blockchain and financial systems.">
  <meta property="og:url" content="https://brianmcmichael.com/">
  <meta property="og:image" content="https://brianmcmichael.com/img/avatar.png">
  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Brian McMichael",
      "url": "https://brianmcmichael.com/",
      "image": "https://brianmcmichael.com/img/avatar.png",
      "jobTitle": "Technical Leader",
      "sameAs": [
        "https://github.com/brianmcmichael",
        "https://x.com/brianmcmichael",
        "https://t.me/brianmcmichael",
        "https://www.linkedin.com/in/brianmcmichael/"
      ]
    }
  </script>

  <style>
    :root {
      color-scheme: light dark;
      --background: #f8fafb;
      --text: #171a19;
      --muted: #69716e;
      --line: #dce2df;
      --accent: #176844;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #101312;
        --text: #edf1ef;
        --muted: #969f9b;
        --line: #2b312e;
        --accent: #69d4a0;
      }
    }

    * { box-sizing: border-box; }

    html {
      min-width: 20rem;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      width: min(100%, 40rem);
      min-height: 100svh;
      align-items: center;
      margin-inline: auto;
      padding: clamp(3rem, 9vw, 6rem) clamp(1.5rem, 6vw, 3rem);
    }

    .content { width: 100%; }

    .avatar {
      display: block;
      width: 4rem;
      height: 4rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      image-rendering: pixelated;
    }

    h1 {
      margin: 1.5rem 0 0.45rem;
      font-size: clamp(1.75rem, 5vw, 2.1rem);
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.2;
    }

    .intro {
      max-width: 31rem;
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .contact {
      margin: 2rem 0 0;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }

    a {
      color: inherit;
      text-decoration-color: var(--line);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.24em;
    }

    a:hover { color: var(--accent); }

    a:focus-visible {
      border-radius: 2px;
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .email {
      color: var(--text);
      font-weight: 550;
      text-decoration: none;
    }

    .email:hover { color: var(--accent); }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 1.25rem;
      margin-top: 1.25rem;
    }

    nav a {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .skip-link {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 1;
      padding: 0.45rem 0.7rem;
      background: var(--text);
      color: var(--background);
      transform: translateY(-5rem);
    }

    .skip-link:focus { transform: translateY(0); }

    @media (max-height: 34rem) {
      main { align-items: flex-start; }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <main id="content">
    <div class="content">
      <img class="avatar" src="img/avatar.png" width="64" height="64" alt="Brian McMichael">

      <h1>Brian McMichael</h1>

      <p class="intro">
        US-based technical leader building in blockchain and financial systems.
      </p>

      <div class="contact">
        <a class="email" href="mailto:brian@brianmcmichael.com">brian@brianmcmichael.com</a>

        <nav aria-label="Profiles">
          <a href="https://github.com/brianmcmichael" target="_blank" rel="me noopener">GitHub</a>
          <a href="https://x.com/brianmcmichael" target="_blank" rel="me noopener">X</a>
          <a href="https://t.me/brianmcmichael" target="_blank" rel="me noopener">Telegram</a>
          <a href="https://www.linkedin.com/in/brianmcmichael/" target="_blank" rel="me noopener">LinkedIn</a>
        </nav>
      </div>
    </div>
  </main>
</body>
</html>
